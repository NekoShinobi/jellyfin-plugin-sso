name: Formatting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npx --yes prettier@3.6.2 --check '**/*.{js,mjs,html,md,css,yml,yaml}'
