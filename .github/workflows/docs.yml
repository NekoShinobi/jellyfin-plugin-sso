name: Documentation

on:
  push:
    branches: [main]
    paths:
      [
        "docs/**",
        "docs-theme/**",
        "zensical.yml",
        "pyproject.toml",
        "uv.lock",
        ".python-version",
        "scripts/check_docs.py",
        ".github/workflows/docs.yml",
      ]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            .python-version
      - name: Install Python
        run: uv python install
      - name: Install documentation tools
        run: uv sync --locked
      - name: Configure GitHub Pages
        id: pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Build documentation
        env:
          DOCS_SITE_URL: ${{ steps.pages.outputs.base_url || 'https://example.invalid/jellyfin-plugin-sso/' }}
          DOCS_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          DOCS_EDIT_URI: edit/main/docs/
        run: |
          export DOCS_SITE_URL="${DOCS_SITE_URL%/}/"
          uv run --locked zensical build --config-file zensical.yml --clean --strict
          uv run --locked python scripts/check_docs.py --site-url "$DOCS_SITE_URL"
      - name: Upload preview
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: documentation-preview
          path: site/
          retention-days: 7
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
